<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Flow Pro | 編輯強化版</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --primary-soft: #eff6ff;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --lv0: #f43f5e;
            --lv1: #f59e0b;
            --lv2: #10b981;
        }

        * { box-sizing: border-box; }
        body {
            font-family: 'PingFang TC', -apple-system, sans-serif;
            background: var(--bg); color: var(--text-main);
            margin: 0; min-height: 100vh; padding: 20px;
            display: flex; justify-content: center;
        }

        .container { width: 100%; max-width: 550px; display: flex; flex-direction: column; }

        /* 統計與搜尋區 */
        .stats-container { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 25px; }
        .stat-card { background: var(--card-bg); padding: 15px; border-radius: 16px; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); border-bottom: 4px solid transparent; }
        .stat-card.lv0 { border-color: var(--lv0); }
        .stat-card.lv1 { border-color: var(--lv1); }
        .stat-card.lv2 { border-color: var(--lv2); }
        .stat-card b { font-size: 20px; display: block; }

        .search-section { background: var(--card-bg); padding: 25px; border-radius: 24px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .input-box { width: 100%; border: 2px solid #e2e8f0; padding: 15px; font-size: 1.1rem; border-radius: 15px; outline: none; transition: 0.3s; }
        .input-box:focus { border-color: var(--primary); box-shadow: 0 0 0 4px var(--primary-soft); }

        /* 翻譯面板 */
        .result-panel { margin-top: 20px; padding: 20px; background: #fff; border-radius: 20px; display: none; border: 1px solid #e2e8f0; animation: fadeIn 0.4s ease; }
        .meaning-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
        .meaning-chip { background: var(--primary-soft); color: var(--primary); padding: 6px 14px; border-radius: 20px; font-size: 0.95rem; font-weight: 500; }

        /* 分頁與列表 */
        .tabs { display: flex; background: #e2e8f0; padding: 5px; border-radius: 14px; margin-bottom: 20px; }
        .tab { flex: 1; text-align: center; padding: 10px; cursor: pointer; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--text-sub); }
        .tab.active { background: white; color: var(--primary); box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        .list-card { background: white; padding: 18px; border-radius: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #f1f5f9; transition: 0.2s; }
        .edit-input { width: 100%; border: 1px solid var(--primary); border-radius: 8px; padding: 4px 8px; margin-bottom: 4px; font-size: 1rem; outline: none; }
        
        .status-indicator { width: 14px; height: 14px; border-radius: 50%; cursor: pointer; border: 2px solid #fff; box-shadow: 0 0 0 2px #e2e8f0; }
        .status-0 { background: var(--lv0); }
        .status-1 { background: var(--lv1); }
        .status-2 { background: var(--lv2); }

        .action-icon { color: #cbd5e1; cursor: pointer; font-size: 18px; margin-left: 12px; transition: 0.2s; }
        .action-icon:hover { color: var(--primary); }
        .save-active { color: #f59e0b !important; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } }
    </style>
</head>
<body>

<div class="container">
    <header style="text-align: center; margin-bottom: 20px;">
        <h1 style="margin:0; font-size: 1.6rem; letter-spacing: -1px;">Vocab Flow Pro</h1>
    </header>

    <div class="stats-container">
        <div class="stat-card lv0"><span>學習中</span><b id="s0">0</b></div>
        <div class="stat-card lv1"><span>熟悉</span><b id="s1">0</b></div>
        <div class="stat-card lv2"><span>已掌握</span><b id="s2">0</b></div>
    </div>

    <div class="search-section">
        <input type="text" id="wordInput" class="input-box" list="wordHints" placeholder="輸入單字，例如: Persistence" autocomplete="off">
        <datalist id="wordHints">
            <option value="Mastering"><option value="Efficiency"><option value="Innovation"><option value="Consistent">
        </datalist>
        
        <div class="result-panel" id="resPanel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 id="origText" style="margin:0; font-size: 1.4rem;"></h2>
                <div>
                    <i class="fas fa-volume-up action-icon" onclick="speakCurrent()"></i>
                    <i class="fas fa-star action-icon" id="starBtn" onclick="save()"></i>
                </div>
            </div>
            <div class="meaning-chips" id="meaningContainer"></div>
        </div>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="setFilter('all', this)">全部</div>
        <div class="tab" onclick="setFilter(0, this)">學習中</div>
        <div class="tab" onclick="setFilter(1, this)">熟悉</div>
        <div class="tab" onclick="setFilter(2, this)">掌握</div>
    </div>

    <div id="vocabList" style="padding-bottom: 50px;"></div>
</div>

<script>
    let words = JSON.parse(localStorage.getItem('vocab_v6_db') || '[]');
    let current = null;
    let filterStatus = 'all';
    let editingId = null;
    let debounceTimer;

    const input = document.getElementById('wordInput');
    const resPanel = document.getElementById('resPanel');

    // 1. 翻譯與拆分邏輯
    input.addEventListener('input', (e) => {
        const text = e.target.value.trim();
        if (!text) { resPanel.style.display = 'none'; return; }

        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(async () => {
            const isChi = /[\u4e00-\u9fa5]/.test(text);
            const pair = isChi ? 'zh-TW|en' : 'en|zh-TW';

            try {
                const response = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${pair}`);
                const data = await response.json();
                const raw = data.responseData.translatedText;
                const meanings = raw.split(/[；;，,／/]/).map(s => s.trim()).filter(s => s.length > 0);

                current = { id: Date.now(), orig: text, trans: meanings.join(' · '), lang: isChi ? 'zh-TW' : 'en', lv: 0 };
                
                document.getElementById('origText').innerText = text;
                document.getElementById('meaningContainer').innerHTML = meanings.map(m => `<div class="meaning-chip">${m}</div>`).join('');
                document.getElementById('starBtn').classList.remove('save-active');
                resPanel.style.display = 'block';
            } catch (err) {}
        }, 500);
    });

    // 2. 儲存與更新
    function save() {
        if (!current || words.some(w => w.orig.toLowerCase() === current.orig.toLowerCase())) return;
        words.unshift({...current});
        document.getElementById('starBtn').classList.add('save-active');
        sync();
    }

    function sync() {
        localStorage.setItem('vocab_v6_db', JSON.stringify(words));
        render();
    }

    // 3. 編輯功能
    function startEdit(id) {
        editingId = id;
        render();
    }

    function saveEdit(id) {
        const card = document.querySelector(`[data-id="${id}"]`);
        const newOrig = card.querySelector('.edit-orig').value;
        const newTrans = card.querySelector('.edit-trans').value;
        
        const idx = words.findIndex(w => w.id === id);
        words[idx].orig = newOrig;
        words[idx].trans = newTrans;
        
        editingId = null;
        sync();
    }

    // 4. 基礎操作
    function toggleLv(id) {
        const i = words.findIndex(w => w.id === id);
        words[i].lv = (words[i].lv + 1) % 3;
        sync();
    }

    function del(id) {
        if(confirm('確定刪除此單字？')) {
            words = words.filter(w => w.id !== id);
            sync();
        }
    }

    function setFilter(status, el) {
        filterStatus = status;
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        render();
    }

    function speakCurrent() { if(current) speak(current.orig, current.lang); }
    function speak(text, lang) {
        const msg = new SpeechSynthesisUtterance(text);
        msg.lang = lang;
        window.speechSynthesis.speak(msg);
    }

    // 5. 渲染引擎
    function render() {
        const list = document.getElementById('vocabList');
        const counts = [0, 0, 0];
        words.forEach(w => counts[w.lv]++);
        document.getElementById('s0').innerText = counts[0];
        document.getElementById('s1').innerText = counts[1];
        document.getElementById('s2').innerText = counts[2];

        const filtered = filterStatus === 'all' ? words : words.filter(w => w.lv === filterStatus);

        list.innerHTML = filtered.map(w => {
            const isEditing = editingId === w.id;
            return `
                <div class="list-card" data-id="${w.id}">
                    <div style="display:flex; align-items:center; gap:15px; flex:1;">
                        <div class="status-indicator status-${w.lv}" onclick="toggleLv(${w.id})"></div>
                        <div style="flex:1;">
                            ${isEditing ? `
                                <input type="text" class="edit-input edit-orig" value="${w.orig}">
                                <input type="text" class="edit-input edit-trans" value="${w.trans}">
                            ` : `
                                <div style="font-weight:700; font-size:1.1rem;">${w.orig}</div>
                                <div style="color:var(--text-sub); font-size:0.9rem;">${w.trans}</div>
                            `}
                        </div>
                    </div>
                    <div style="display:flex;">
                        ${isEditing ? `
                            <i class="fas fa-check action-icon" style="color:var(--lv2)" onclick="saveEdit(${w.id})"></i>
                        ` : `
                            <i class="fas fa-pen action-icon" onclick="startEdit(${w.id})"></i>
                            <i class="fas fa-volume-up action-icon" onclick="speak('${w.orig}','${w.lang}')"></i>
                            <i class="fas fa-trash-alt action-icon" onclick="del(${w.id})"></i>
                        `}
                    </div>
                </div>
            `;
        }).join('');
    }

    render();
</script>

</body>
</html>
